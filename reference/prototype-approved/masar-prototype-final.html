const STG=[['Foundations','الأساسيات'],['Hands-on','التطبيق'],['Portfolio project','مشروع ختامي']];

const TM=[['Read','قراءة',20],['Video','فيديو',30],['Exercise','تمرين',45],['Practice','تطبيق',60],['Project','مشروع',120],['Review','مراجعة',30]];
const IC={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',explore:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM16 8l-2 6-6 2 2-6z',quiz:'M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 16.8 5.7 21.4 8 14 2 9.4h7.6z',lab:'M9 3h6M10 3v6L4 19a1.5 1.5 0 0 0 1.3 2h13.4A1.5 1.5 0 0 0 20 19l-6-10V3',road:'M6 3v12M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM18 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM18 9v3a3 3 0 0 1-3 3H9',opp:'M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',dash:'M4 20V10M10 20V4M16 20v-7M22 20H2'};
const NAV=['home','explore','quiz','lab','road','opp','dash'],BOT=['home','explore','road','opp','dash'];
const ni=k=>`<button class="ni ${S.pg===k?'on':''}" data-a="go" data-v="${k}"><svg viewBox="0 0 24 24"><path d="${IC[k]}"/></svg>${t(k)}</button>`;
function toast(m){const e=$('#ts');e.textContent=m;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2200)}
function award(k,m,xp){if(S.bd[k])return;S.bd[k]=1;S.xp+=xp;if(m)toast(m)}
const prog=id=>{let n=0;for(let s=0;s<3;s++)for(let i=0;i<2;i++)if(S.done[id+s+i])n++;return n};
const nm=id=>x(tr(id).n);
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;

const ROUTE=()=>`<svg viewBox="0 0 440 300" role="img" aria-label="path"><path class="rt b" d="M30 250C130 250 120 140 220 150S340 60 410 40"/><path class="rt a" d="M30 250C130 250 120 140 220 150S340 60 410 40"/>${[[30,250,0],[130,196,1],[250,130,2],[410,40,3]].map(n=>`<circle class="nd" cx="${n[0]}" cy="${n[1]}" r="9" style="animation-delay:${.4+n[2]*.5}s"/><text class="rt-l" x="${n[0]}" y="${n[1]+28}" text-anchor="middle">${['Discover','Try','Learn','Apply'][n[2]]==='Discover'&&S.lang==='ar'?'اكتشف':S.lang==='ar'?['','جرّب','اتعلّم','اتقدّم'][n[2]]:['Discover','Try','Learn','Apply'][n[2]]}</text>`).join('')}</svg>`;
const STEPS=[['Discover','اكتشف','Take the optional quiz or browse every track.','اعمل الاختبار الاختياري أو تصفح كل المجالات.'],['Try','جرّب','Run a short scenario and see if the work clicks.','جرّب سيناريو قصير وشوف الشغل مناسبك ولا لأ.'],['Learn','اتعلّم','Follow a staged roadmap with clear milestones.','امشي في خارطة مراحل بمعالم واضحة.'],['Apply','اتقدّم','Find local trainings and internships that fit.','لاقي تدريبات وفرص محلية مناسبة ليك.']];

const P={
home:()=>`<div class="wrap"><section class="hero"><div><span class="tag">${t('tag')}</span><h1>${t('h1')}</h1><p class="lead">${t('lead')}</p><div class="row"><button class="btn" data-a="go" data-v="quiz">${t('start')}</button><button class="btn g" data-a="go" data-v="explore">${t('exp')}</button></div><p class="sm mu">${t('opt')}</p></div>${ROUTE()}</section>
<section data-r style="margin-top:50px"><h2>${t('nc')}</h2><p class="mu">${t('nc2')}</p>${[...TR].sort((a,b)=>a.c-b.c).map(o=>`<div class="cl"><span>${x(o.n)}</span>${bar(o.c)}<b class="sm">${o.c}%</b></div>`).join('')}</section>
<section data-r style="margin-top:40px"><h2>${t('how')}</h2><div class="g2">${STEPS.map((s,i)=>`<div class="pn"><span class="tag">0${i+1}</span><h3>${x([s[0],s[1]])}</h3><p class="mu sm">${x([s[2],s[3]])}</p></div>`).join('')}</div></section></div>`,
explore:()=>`<div class="wrap"><h1 style="font-size:clamp(2rem,5vw,3rem)">${t('exp')}</h1><p class="lead">${t('nc2')}</p>${TR.map((o,i)=>`<button class="trow" data-a="open" data-v="${o.id}"><span class="num">0${i+1}</span><span><h3>${x(o.n)}</h3><span class="mu sm">${x(o.d)}</span></span><span class="row" style="flex-wrap:nowrap"><span style="flex:1;min-width:60px">${bar(o.c)}</span><b class="sm">${o.c}%</b></span><span>${S.lang==='ar'?'←':'→'}</span></button>`).join('')}</div>`,
track:()=>{const o=tr(S.tid);return`<div class="wrap"><button class="ic" data-a="go" data-v="explore">${S.lang==='ar'?'→':'←'} ${t('back')}</button><h1>${x(o.n)}</h1><p class="lead">${x(o.d)}</p>
<div class="g2"><div class="pn"><span class="mu sm">${t('lv')}</span><h3>${x(DIFF[o.df])}</h3></div><div class="pn"><span class="mu sm">${t('du')}</span><h3>~${o.wk} ${t('wk')}</h3></div></div>
<div class="pn"><span class="mu sm">${o.c}% ${t('cod')}</span>${bar(o.c)}</div>
<h2>${t('sk')}</h2><div>${o.sk.map(s=>`<span class="chip">${s}</span>`).join('')}</div>
<h2>${t('lp')}</h2>${STG.map((s,i)=>`<div class="task" style="cursor:default"><span class="num tag">0${i+1}</span><span>${x(s)}</span></div>`).join('')}
<div class="row" style="margin-top:22px"><button class="btn" data-a="road" data-v="${o.id}">${t('sr')}</button>${o.id==='net'?`<button class="btn g" data-a="go" data-v="lab">${t('try')}</button>`:''}</div></div>`},
quiz:()=>{const i=S.qi,q=Q[i];return`<div class="wrap nar"><div class="row" style="justify-content:space-between"><span class="mu sm">${t('q')} ${i+1}/${Q.length}</span><span class="sm mu">${t('opt')}</span></div>${bar((i+1)/Q.length*100)}
<div class="qa" style="margin-top:24px"><h2>${x(q[0])}</h2>${q[1].map((o,k)=>`<button class="opt" data-a="pick" data-v="${k}"><b>${'ABC'[k]}</b>${x(o[0])}</button>`).join('')}</div>${i?`<button class="ic" data-a="qb">${t('back')}</button>`:''}</div>`},
res:()=>{const r=S.res,u=r.u,mx=Math.max(...u,1),C=130,R=90,pt=(i,f)=>{const a=-Math.PI/2+i*Math.PI/3;return[C+R*f*Math.cos(a),C+R*f*Math.sin(a)]};
return`<div class="wrap nar"><h1 style="font-size:clamp(2rem,5vw,3rem)">${t('top3')}</h1>${r.top.map((o,i)=>`<div class="pn"><div class="row" style="justify-content:space-between"><h3><span class="num" style="color:var(--brt)">0${i+1}</span> ${nm(o.id)}</h3><b>${o.p}% <span class="mu sm">${t('mt')}</span></b></div>${bar(o.p)}<p class="mu sm">${o.why}</p><button class="btn g" data-a="open" data-v="${o.id}">${t('open')}</button></div>`).join('')}
<div class="pn"><h3>${t('prof')}</h3><svg viewBox="0 0 260 260" style="max-width:280px;display:block;margin:auto">${[.33,.66,1].map(f=>`<polygon points="${DN.map((_,i)=>pt(i,f)).join(' ')}" fill="none" stroke="var(--bd)"/>`).join('')}<polygon points="${DN.map((_,i)=>pt(i,Math.max(.08,u[i]/mx)).join(',')).join(' ')}" fill="var(--brt)" fill-opacity=".25" stroke="var(--brt)" stroke-width="2" style="transform-origin:130px 130px;animation:rz .9s var(--ease)"/>${DN.map((d,i)=>{const[a,b]=pt(i,1.2);return`<text x="${a}" y="${b+4}" text-anchor="middle" font-size="11" fill="var(--tx)">${x(d)}</text>`}).join('')}</svg></div><style>@keyframes rz{from{transform:scale(0)}}</style>
<p class="note">${t('note')}</p><button class="btn g" data-a="go" data-v="quiz">${t('again')}</button></div>`},
lab:()=>{if(S.lab>=3)return PL();const s=LAB[S.lab],a=S.la[S.lab];return`<div class="wrap nar"><span class="tag">${t('ln')}</span><div class="row" style="margin:10px 0"><span class="mu sm">${S.lab+1}/3</span><span style="flex:1">${bar((S.lab+1)/3*100)}</span></div>${s.term?`<div class="term">${s.term}</div>`:''}<div class="qa"><h2>${x(s.q)}</h2>${s.o.map((o,k)=>`<button class="opt ${a===undefined?'':o[1]?'good':a===k?'bad':''}" ${a===undefined?'':'disabled'} data-a="lp" data-v="${k}"><b>${'ABC'[k]}</b>${x(o[0])}</button>`).join('')}</div>${a!==undefined?`<div class="fb">${x(s.o[a][2])}</div><button class="btn" data-a="ln">${S.lab===2?t('fin'):t('nx')}</button>`:''}</div>`},
road:()=>{const o=tr(S.tid),n=prog(o.id);return`<div class="wrap nar"><div class="row">${TR.map(r=>`<button class="chip ${r.id===S.tid?'on':''}" data-a="road" data-v="${r.id}">${x(r.n)}</button>`).join('')}</div><h1 style="font-size:2.2rem">${x(o.n)}</h1><div class="row"><span class="mu sm">${n}/6</span><span style="flex:1">${bar(n/6*100)}</span></div>
${STG.map((s,si)=>`<div class="pn"><h3>${si+1}. ${x(s)}</h3>${TASKS[si].map((k,i)=>{const m=TM[si*2+i],d=S.done[o.id+si+i];return`<div class="task ${d?'done':''}" data-a="tk" data-v="${si}${i}"><span class="ck">${d?'✓':''}</span><span class="t" style="flex:1">${x(k).replace('{n}',nm(o.id))}<br><span class="mu sm">${x([m[0],m[1]])} · ${m[2]} min</span></span></div>`}).join('')}</div>`).join('')}</div>`},
opp:()=>{const L=OPP.filter(o=>(S.ty==='all'||o[2]===S.ty)&&(S.gov==='all'||o[3]==='all'||o[3]===S.gov)&&(!S.q||o[0].toLowerCase().includes(S.q.toLowerCase())));
return`<div class="wrap"><h1 style="font-size:clamp(2rem,5vw,3rem)">${t('opp')}</h1><div class="row"><input type="text" id="qs" placeholder="${t('sch')}" value="${S.q}"><select id="gs">${Object.keys(GOV).map(g=>`<option value="${g}" ${g===S.gov?'selected':''}>${x(GOV[g])}</option>`).join('')}</select></div><div class="row" style="margin:12px 0">${Object.keys(OT).map(k=>`<button class="chip ${S.ty===k?'on':''}" data-a="ty" data-v="${k}">${x(OT[k])}</button>`).join('')}</div>
${L.map(o=>`<div class="pn"><div class="row" style="justify-content:space-between"><h3>${o[0]}</h3><span class="chip" style="${o[5]<=7?'border-color:var(--co);color:var(--co)':''}">${o[5]} ${t('dl')}</span></div><span class="mu sm">${o[1]} · ${x(GOV[o[3]])} · </span><span class="chip">${x(OT[o[2]])}</span><span class="chip">${nm(o[4])}</span></div>`).join('')||`<p class="mu">—</p>`}<p class="note">${t('smp')}</p></div>`},
dash:()=>{const o=tr(S.tid),n=prog(o.id),C=2*Math.PI*44,nx=[0,1,2].flatMap(s=>[0,1].map(i=>[s,i])).find(([s,i])=>!S.done[o.id+s+i]),rel=OPP.filter(p=>p[4]===o.id);
const B=[['quiz','★',T.bfq],['lab','⚗',T.bfl],['stg','✔',T.sdone]];
return`<div class="wrap"><h1 style="font-size:clamp(2rem,5vw,3rem)">${t('hi')} 👋</h1><div class="g2"><div class="pn row" style="gap:20px"><svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="44" fill="none" stroke="var(--s2)" stroke-width="9"/><circle cx="55" cy="55" r="44" fill="none" stroke="var(--brt)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-n/6)}" transform="rotate(-90 55 55)" style="transition:stroke-dashoffset 1s var(--ease)"/><text x="55" y="61" text-anchor="middle" font-size="20" font-weight="700" fill="var(--tx)">${Math.round(n/6*100)}%</text></svg><div><span class="mu sm">${t('pr')}</span><h3>${nm(o.id)}</h3><b>${S.xp} ${t('xp')}</b></div></div>
<div class="pn"><span class="mu sm">${t('ns')}</span><h3>${nx?x(TASKS[nx[0]][nx[1]]).replace('{n}',nm(o.id)):'🎉'}</h3><button class="btn" data-a="road" data-v="${o.id}">${t('sr')}</button></div></div>
<div class="g2"><div class="pn"><h3>${t('bg')}</h3>${B.map(b=>`<div class="bdg ${S.bd[b[0]]?'on':''}"><i>${b[1]}</i><span>${x(b[2])}</span></div>`).join('')}</div>
<div class="pn"><h3>${t('ofy')}</h3>${rel.map(p=>`<p><b>${p[0]}</b><br><span class="mu sm">${p[5]} ${t('dl')}</span></p>`).join('')||`<p class="mu">${t('none')}</p>`}</div></div></div>`}};
function PL(){const n=S.la.filter((a,i)=>LAB[i].o[a][1]).length;return`<div class="wrap nar"><h1 style="font-size:2.4rem">${n}/3 ✓</h1><div class="pn"><h3>${t('eq')}</h3>${[['yes','Y'],['sw','S'],['no','N']].map(e=>`<button class="chip ${S.enj===e[1]?'on':''}" data-a="enj" data-v="${e[1]}">${t(e[0])}</button>`).join('')}</div><div class="row"><button class="btn" data-a="road" data-v="net">${t('sr')}</button><button class="btn g" data-a="lr">${t('again')}</button></div></div>`}
P.lab0=P.lab;P.lab=()=>S.lab===-1?labs():P.lab0();
function labs(){return`<div class="wrap"><h1 style="font-size:clamp(2rem,5vw,3rem)">${t('lt')}</h1><p class="lead">${t('ld')}</p><div class="g2"><div class="pn"><span class="tag">${nm('net')}</span><h3>${t('ln')}</h3><p class="mu sm">3 steps · ~10 min</p><button class="btn" data-a="ls">${t('try')}</button></div>${['sec','data'].map(i=>`<div class="pn" style="opacity:.55"><span class="tag">${nm(i)}</span><h3>—</h3><button class="btn" disabled>${t('soon')}</button></div>`).join('')}</div></div>`}

function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';$('#lb').textContent=S.lang==='ar'?'EN':'ع';$('#side').innerHTML=NAV.map(ni).join('');$('#bot').innerHTML=BOT.map(ni).join('');
 const pg=S.pg==='open'?'track':S.pg;$('#m').innerHTML=P[pg]();document.querySelectorAll('[data-r]').forEach(e=>io.observe(e));window.scrollTo(0,0)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
function finishQuiz(){const u=[0,0,0,0,0,0];let cp=.5;S.qa.forEach((k,i)=>{const w=Q[i][1][k][1];for(let j=0;j<6;j++)u[j]+=w[j];if(w[6]!==undefined)cp=w[6]});
 const un=Math.hypot(...u)||1,top=TR.map(o=>{const cos=o.v.reduce((a,b,j)=>a+b*u[j],0)/(Math.hypot(...o.v)*un),m=cos-.25*Math.abs(cp-o.c/100),p=Math.round(Math.max(40,Math.min(97,(m-.25)/.7*100)));
 const d=o.v.map((v,j)=>[v*u[j],j]).sort((a,b)=>b[0]-a[0]).slice(0,2).map(z=>x(DN[z[1]]));return{id:o.id,p,why:S.lang==='ar'?`جانبك ${d[0]} و${d[1]} مناسب للمجال ده، ومستوى حبك للبرمجة قريب من المطلوب.`:`Your ${d[0]} and ${d[1]} side fits this field, and your comfort with code is close to what it needs.`}}).sort((a,b)=>b.p-a.p).slice(0,3);
 S.res={u,top};award('quiz',t('bfq'),50);S.pg='res';render()}
function act(a,v){switch(a){
 case'go':S.pg=v;if(v==='lab')S.lab=-1;break;case'open':S.tid=v;S.pg='track';break;case'road':S.tid=v;S.pg='road';break;
 case'lang':S.lang=S.lang==='ar'?'en':'ar';break;case'theme':{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';return}
 case'pick':S.qa[S.qi]=+v;if(S.qi<Q.length-1)S.qi++;else return finishQuiz();break;case'qb':S.qi--;break;
 case'ls':S.lab=0;S.la=[];break;case'lp':S.la[S.lab]=+v;break;case'ln':S.lab++;if(S.lab>=3)award('lab',t('bfl'),75);break;case'lr':S.lab=0;S.la=[];break;case'enj':S.enj=v;break;
 case'tk':{const s=+v[0],i=+v[1],k=S.tid+s+i;if(S.done[k]){delete S.done[k]}else{S.done[k]=1;S.xp+=20;if(S.done[S.tid+s+0]&&S.done[S.tid+s+1]){toast(t('sdone'));award('stg',null,100)}}break}
 case'ty':S.ty=v;break}
 render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id==='qs'){S.q=e.target.value;const p=e.target.selectionStart,y=scrollY;render();scrollTo(0,y);const n=$('#qs');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='gs'){S.gov=e.target.value;render()}});
render();
</script>
</body>
</html>
